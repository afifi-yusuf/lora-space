[project]
name = "lso"
version = "0.1.0"
description = "LoRA-Space Bench: editor models write LoRA adapters for frozen models from a plain-English request, without gradients"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "huggingface_hub>=0.30",
    "openai>=1.80",
]

[project.optional-dependencies]
# GPU box: model inference, activation inspection, evaluation
gpu = [
    "torch>=2.6",
    "transformers>=4.57",
    "safetensors>=0.5",
    "vllm>=0.11",
    "math-verify>=0.7",
]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
