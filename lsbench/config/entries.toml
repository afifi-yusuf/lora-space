[limits]                             # identical for every entry
wall_hours = 3.0                     # per session, Frontier-CS style hard stop
stall_minutes = 30                   # no model or tool call finished for this long: stop as "stalled" (infra; rerun)
generate_calls = 25
generate_prompts = 32
analysis_calls = 50                  # inspect, inspect_module_inputs and the interpretability tools together
analysis_items = 32                  # texts per analysis call
inspect_texts = 64
candidates_track_b = 5
max_rank = 8
