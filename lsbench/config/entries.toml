# Entries = editor model x harness (Frontier-CS style). v1 (2026-11-12): Track A only, 1 attempt per entry; every model on
# Agency native plus its provider's harness. Kimi K3.1 Pro and DeepSeek V4.1 Flash take no reasoning.effort on Azure (400
# "Unsupported parameter"), so they run at their default: Kimi reasons by default; DeepSeek V4.1 Flash returns no
# reasoning items (non-thinking as served). astra-minimal is the pilot reference loop (not ranked). All models are served from the Azure Foundry resource
# `principle` (AZURE_OPENAI_API_KEY in secrets.env), except Fable 5.2 (Anthropic API, ANTHROPIC_API_KEY; not on Azure) and Gemini, which only Google serves (Vertex AI in project
# balmy-mark-514604-i9, Chat Completions via its OpenAI-compatible endpoint, reached through lsbench.vertex_proxy, which
# adds the service account's token from gcp-sa.json; no Agency adapter exists for Gemini CLI or Antigravity). Prices are USD per million tokens, for the cost columns;
# fill in from the Azure price sheet before publishing (None = cost not computed).

[[entry]]
id = "astra-minimal"
label = "GPT-6 Astra (minimal loop)"
model = "gpt-6-astra"
provider = "openai_responses"
base_url = "https://principle.openai.azure.com/openai/v1"
harness = "minimal"
effort = "xhigh"

[[entry]]
id = "astra-native"
label = "GPT-6 Astra (Agency native)"
model = "gpt-6-astra"
provider = "openai_responses"
base_url = "https://principle.openai.azure.com/openai/v1"
harness = "native"
effort = "xhigh"

