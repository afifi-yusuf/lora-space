# Entries = editor model x harness (Frontier-CS style). v1 (2026-11-12): Track A only, 1 attempt per entry; every model on
# Agency native plus its provider's harness. astra-minimal is the pilot reference loop (not ranked). All models are served from the Azure Foundry resource
# `principle`; one key (AZURE_OPENAI_API_KEY in secrets.env). Prices are USD per million tokens, for the cost columns;
# fill in from the Azure price sheet before publishing (None = cost not computed).

[[entry]]
id = "astra-minimal"
label = "GPT-6 Astra (minimal loop)"
model = "gpt-6-astra"
provider = "openai_responses"
base_url = "https://principle.openai.azure.com/openai/v1"
harness = "minimal"
effort = "xhigh"

[[entry]]
id = "astra-native"
label = "GPT-6 Astra (Agency native)"
model = "gpt-6-astra"
provider = "openai_responses"
base_url = "https://principle.openai.azure.com/openai/v1"
